name: Publish CodeQL Query Pack

on:
  push:
    branches: [ main ]
    paths:
      - 'queries/**'
      - 'codeql-pack.yml'
      - 'qlpack.yml'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CodeQL CLI
        run: |
          CODEQL_VERSION="2.15.5"
          curl -L -o codeql.zip "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip"
          unzip codeql.zip
          echo "$PWD/codeql" >> $GITHUB_PATH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish CodeQL pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          codeql pack create
          codeql pack publish --registry=https://ghcr.io
