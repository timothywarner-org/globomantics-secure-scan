name: Publish CodeQL Query Pack

on:
  push:
    branches: [ main ]
    paths:
      - 'queries/**'
      - 'codeql-pack.yml'
      - 'qlpack.yml'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup CodeQL CLI
        id: setup-codeql
        run: |
          CODEQL_VERSION="2.15.5"
          curl -sSL -o codeql.zip https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip
          unzip -q codeql.zip
          echo "$PWD/codeql" >> $GITHUB_PATH
          echo "CODEQL_PATH=$PWD/codeql" >> $GITHUB_ENV

      - name: Verify CodeQL CLI availability
        run: |
          codeql --version || { echo "CodeQL CLI not found"; exit 1; }

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CodeQL pack dependencies
        run: |
          codeql pack install || {
            echo "::error ::Failed to install CodeQL pack dependencies. Check that 'codeql/javascript-all' is spelled correctly and published.";
            exit 1;
          }

      - name: Validate pack structure
        run: |
          test -f codeql-pack.yml || { echo "::error ::Missing codeql-pack.yml"; exit 1; }
          test -d queries || { echo "::error ::Missing queries directory"; exit 1; }

      - name: Package and publish CodeQL pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating pack..."
          codeql pack create || {
            echo "::error ::Failed to create CodeQL pack.";
            exit 1;
          }

          echo "Publishing pack..."
          codeql pack publish --registry=https://ghcr.io || {
            echo "::error ::Failed to publish CodeQL pack.";
            exit 1;
          }
