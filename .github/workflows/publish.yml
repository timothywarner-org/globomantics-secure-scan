name: Publish CodeQL Pack to GHCR

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Publish CodeQL pack
        run: |
          VERSION=$(cat codeql-pack.yml | grep "version:" | cut -d" " -f2-)
          echo "Publishing pack version $VERSION"
          
          # Create the CodeQL pack path
          PACK_PATH="ghcr.io/${GITHUB_REPOSITORY_OWNER}/globomantics-javascript-security-queries:${VERSION}"
          
          # Login with GitHub token
          echo ${{ secrets.GITHUB_TOKEN }} | codeql pack login ghcr.io --token-stdin
          
          # Publish the pack
          codeql pack publish --pack-path=. $PACK_PATH
          
          # Also tag as latest
          codeql pack publish --pack-path=. ghcr.io/${GITHUB_REPOSITORY_OWNER}/globomantics-javascript-security-queries:latest 